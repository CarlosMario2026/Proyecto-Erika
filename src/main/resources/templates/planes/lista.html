<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Planes - Movi Kar 6G</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-5">

<h1 class="mb-4">Planes Telefónicos</h1>

<a th:href="@{/planes/nuevo}" class="btn btn-primary mb-3">
    Nuevo Plan
</a>

<table class="table table-bordered table-striped">

    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>Precio</th>
        <th>Gigas</th>
        <th>Minutos</th>
        <th>Descripción</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="plan : ${planes}">
        <td th:text="${plan.id}"></td>
        <td th:text="${plan.nombre}"></td>
        <td th:text="${plan.tipo}"></td>
        <td th:text="${plan.precio}"></td>
        <td th:text="${plan.gigas}"></td>
        <td th:text="${plan.minutos}"></td>
        <td th:text="${plan.descripcion}"></td>

        <td>
            <a th:href="@{/planes/eliminar/{id}(id=${plan.id})}"
               class="btn btn-danger btn-sm">
                Eliminar
            </a>
        </td>
    </tr>
    </tbody>

</table>

</body>
</html>
